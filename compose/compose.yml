      # - type: bind
      #   source: "${DATA_ROOT}/${DB2022E_DIR}/secrets"
      #   target: /var/opt/mssql/secrets
      #   bind:
      #     create_host_path: true


# ─── 네트워크 ────────────────────────────────────────────────────────────────
# 모든 컨테이너를 같은 가상 네트워크에 묶습니다. 컨테이너끼리는 hostname 으로 서로 접근합니다.
networks:
  mssql:
    name: ${NETWORK_NAME:-mssql-farm-net}
    driver: ${NETWORK_DRIVER:-bridge}
